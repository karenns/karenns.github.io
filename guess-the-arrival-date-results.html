<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Winner — Guess the Arrival Date</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F4EE; --card:#FFFFFF; --ink:#2E3A2E; --muted:#7C8A7C;
    --sage:#8FA98F; --sage-deep:#5F7A5F; --sage-soft:#E4EBE1; --sage-line:#D2DECE;
    --gold:#C2A05A; --gold-soft:#F4EBD6;
    --shadow:0 1px 2px rgba(46,58,46,.06), 0 8px 28px rgba(46,58,46,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Karla,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; padding:28px 16px 60px;
    background-image:radial-gradient(circle at 12% 8%, #EDF1E8 0%, transparent 45%),
                     radial-gradient(circle at 88% 92%, #F5EEE0 0%, transparent 40%);
    background-attachment:fixed;
  }
  .wrap{max-width:700px;margin:0 auto}
  header{text-align:center;margin-bottom:26px}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage-deep);font-weight:700;margin-bottom:10px}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(32px,6.5vw,48px);font-weight:600;line-height:1.05;margin:0 0 10px}
  .sub{color:var(--muted);font-size:14.5px}
  .card{background:var(--card);border:1px solid var(--sage-line);border-radius:20px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  input[type=date]{
    width:100%;padding:14px 16px;font-size:16px;font-family:inherit;color:var(--ink);
    background:#FCFBF8;border:1.5px solid var(--sage-line);border-radius:12px;outline:none;
  }
  input[type=date]:focus{border-color:var(--sage);background:#fff;box-shadow:0 0 0 4px rgba(143,169,143,.15)}
  button.go{
    width:100%;margin-top:14px;padding:16px;border:none;border-radius:12px;cursor:pointer;
    background:var(--sage-deep);color:#fff;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.04em;
    transition:background .15s ease, transform .12s ease;
  }
  button.go:hover:not(:disabled){background:#4E664E;transform:translateY(-1px)}
  button.go:disabled{background:#C3CFC1;cursor:not-allowed}
  button.ghost{
    width:100%;margin-top:10px;padding:13px;border:1.5px solid var(--sage-line);border-radius:12px;cursor:pointer;
    background:transparent;color:var(--sage-deep);font-family:inherit;font-size:14px;font-weight:600;
  }
  button.ghost:hover{background:var(--sage-soft)}
  .msg{margin-top:14px;padding:13px 15px;border-radius:12px;font-size:14px;display:none}
  .msg.err{display:block;background:#FBEBE7;color:#9A4630;border:1px solid #F1D2CA}
  .msg.info{display:block;background:#F1EFE8;color:#6B6558;border:1px solid #E2DED2}
  /* winner */
  #winnerCard{display:none;text-align:center;background:linear-gradient(180deg,#FFFDF8 0%,#FFFFFF 60%);border-color:var(--gold)}
  .trophy{font-size:44px;line-height:1;margin-bottom:6px}
  .winlabel{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#8A6E28;font-weight:700;margin-bottom:12px}
  .winname{font-family:"Cormorant Garamond",serif;font-size:clamp(34px,8vw,50px);font-weight:700;line-height:1.05;margin:0 0 12px}
  .winmeta{display:inline-block;background:var(--gold-soft);border:1px solid #E7D6AE;color:#7A6224;padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:600}
  .actual{margin-top:18px;padding-top:16px;border-top:1px solid #EFEDE6;font-size:14px;color:var(--muted)}
  .actual b{display:block;font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;color:var(--ink);margin-top:4px}
  /* leaderboard */
  #boardCard{display:none}
  h2{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;margin:0 0 16px}
  ol.board{list-style:none;margin:0;padding:0;counter-reset:rank}
  ol.board li{
    display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;
    border-bottom:1px solid #EFEDE6;font-size:15px;
  }
  ol.board li:last-child{border-bottom:none}
  ol.board li.win{background:var(--gold-soft);border-bottom-color:#EBDCBB}
  .rank{
    width:28px;height:28px;flex:none;border-radius:50%;background:var(--sage-soft);color:var(--sage-deep);
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;
  }
  li.win .rank{background:var(--gold);color:#fff}
  .who{flex:1;min-width:0}
  .who .nm{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who .gd{font-size:12.5px;color:var(--muted)}
  .off{flex:none;text-align:right;font-size:13px;font-weight:600;color:var(--sage-deep);white-space:nowrap}
  .off small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  footer{text-align:center;margin-top:26px;font-size:12.5px;color:var(--muted)}
  footer a{color:var(--sage-deep)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Baby Shower Game</div>
    <h1>And the winner is…</h1>
    <div class="sub">Enter the day baby actually arrived to reveal the closest guess.</div>
  </header>

  <div class="card" id="inputCard">
    <label for="actual">Actual arrival date</label>
    <input type="date" id="actual" value="2026-10-25">
    <button class="go" id="reveal">Reveal the winner</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="winnerCard">
    <div class="trophy">&#127942;</div>
    <div class="winlabel" id="winlabel">Closest Guess</div>
    <h2 class="winname" id="winname"></h2>
    <div class="winmeta" id="winmeta"></div>
    <div class="actual">Baby arrived on<b id="actualOut"></b></div>
  </div>

  <div class="card" id="boardCard">
    <h2>Full leaderboard <span id="count" style="font-size:15px;color:var(--muted);font-family:Karla,sans-serif"></span></h2>
    <ol class="board" id="board"></ol>
    <button class="ghost" id="again">Change the date / refresh guesses</button>
  </div>

  <footer><a href="index.html">&larr; Back to the guessing page</a></footer>
</div>

<script>
/* ============================================================
   CONFIG — must match the values in index.html
   ============================================================ */
const BIN_ID     = '6a85032bf5f4af5e2926aaef';       // your JSONBin bin ID
const ACCESS_KEY = '$2a$10$Js4A16x6i8s9qvnmDDgnDO2/KJnqTwa02pmH/sQeR.Ju8D2f6hmt2';     // your JSONBin access key
const KEY_HEADER = 'X-Access-Key'; // use 'X-Master-Key' if you pasted a master key
/* ============================================================ */

const API = 'https://api.jsonbin.io/v3/b/' + BIN_ID;
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const pretty = s => { const dt = toDate(s); return DAYS[dt.getDay()] + ', ' + MONTHS[dt.getMonth()] + ' ' + dt.getDate() + ', ' + dt.getFullYear(); };
const short  = s => { const dt = toDate(s); return MONTHS[dt.getMonth()].slice(0,3) + ' ' + dt.getDate(); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function show(type, text){ const m = document.getElementById('msg'); m.className = 'msg ' + type; m.textContent = text; }
function hideMsg(){ document.getElementById('msg').className = 'msg'; }

async function loadGuesses(){
  const res = await fetch(API + '/latest', { headers: { [KEY_HEADER]: ACCESS_KEY } });
  if (!res.ok) throw new Error('Read failed (' + res.status + ')');
  const data = await res.json();
  const rec = data.record;
  return Array.isArray(rec) ? rec : (Array.isArray(rec && rec.guesses) ? rec.guesses : []);
}

function diffDays(a, b){ return Math.round((toDate(a) - toDate(b)) / 86400000); }

document.getElementById('reveal').addEventListener('click', async () => {
  const btn = document.getElementById('reveal');
  const actual = document.getElementById('actual').value;
  if (!actual){ show('err', 'Pick the actual arrival date first.'); return; }

  hideMsg();
  btn.disabled = true; btn.textContent = 'Tallying…';
  try {
    const guesses = await loadGuesses();
    if (!guesses.length){
      show('info', 'No guesses have been submitted yet.');
      btn.disabled = false; btn.textContent = 'Reveal the winner';
      return;
    }

    const scored = guesses.map(g => {
      const d = diffDays(g.date, actual);          // + = guessed late, - = guessed early
      return { name: g.name, date: g.date, delta: d, off: Math.abs(d) };
    }).sort((a,b) => a.off - b.off || a.name.localeCompare(b.name));

    const best    = scored[0].off;
    const winners = scored.filter(s => s.off === best);

    document.getElementById('winlabel').textContent = winners.length > 1 ? 'It’s a tie!' : 'Closest Guess';
    document.getElementById('winname').textContent  = winners.map(w => w.name).join('  &  ');
    document.getElementById('winmeta').textContent  =
      (winners.length > 1 ? 'They each guessed ' : 'Guessed ') +
      (winners.length > 1 ? winners.map(w => short(w.date)).join(' / ') : pretty(winners[0].date)) +
      ' — ' + (best === 0 ? 'exactly right!' : best + (best === 1 ? ' day off' : ' days off'));
    document.getElementById('actualOut').textContent = pretty(actual);
    document.getElementById('count').textContent = '(' + scored.length + ' guesses)';

    document.getElementById('board').innerHTML = scored.map((s, i) => {
      const dir = s.delta === 0 ? 'spot on' : (s.delta < 0 ? 'too early' : 'too late');
      const off = s.off === 0 ? 'Exact' : s.off + (s.off === 1 ? ' day' : ' days');
      return '<li class="' + (s.off === best ? 'win' : '') + '">' +
               '<span class="rank">' + (i+1) + '</span>' +
               '<span class="who"><span class="nm">' + esc(s.name) + '</span>' +
               '<span class="gd">' + pretty(s.date) + '</span></span>' +
               '<span class="off">' + off + '<small>' + dir + '</small></span>' +
             '</li>';
    }).join('');

    document.getElementById('inputCard').style.display  = 'none';
    document.getElementById('winnerCard').style.display = 'block';
    document.getElementById('boardCard').style.display  = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    console.error(e);
    show('err', "Couldn't load the guesses. Check your internet connection and the JSONBin settings in this file.");
  } finally {
    btn.disabled = false; btn.textContent = 'Reveal the winner';
  }
});

document.getElementById('again').addEventListener('click', () => {
  document.getElementById('inputCard').style.display  = 'block';
  document.getElementById('winnerCard').style.display = 'none';
  document.getElementById('boardCard').style.display  = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
</body>
</html>
